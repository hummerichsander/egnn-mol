name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create virtualenv
        # The runner's system Python is externally managed, so install into a uv venv
        # rather than with --system.
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install
        # torch-cluster compiles from source against an installed torch, so the whole install
        # runs without build isolation. That means every build backend must already be in the
        # venv: hatchling + editables for egnn-mol's editable build, setuptools/wheel for
        # torch-cluster.
        run: |
          uv pip install torch hatchling editables setuptools wheel
          uv pip install --no-build-isolation -e ".[dev]"
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Pytest
        run: uv run --no-sync pytest -q
