[project]
name = "egnn-mol"
version = "0.1.0"
description = "E(n)-equivariant GNN backbones for molecular simulation, in dense (native torch) and sparse (torch-geometric) form."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sander Hummerich", email = "hummerich@thphys.uni-heidelberg.de" }]
dependencies = [
    "torch>=2.1",
    "einops>=0.7",
    "torch-geometric>=2.7.0",
    "torch-cluster>=1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egnn_mol"]

[tool.ruff]
exclude = ["tests", ".venv", "__pycache__", "*.egg-info"]
