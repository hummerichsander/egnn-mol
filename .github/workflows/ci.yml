name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        # torch-cluster compiles against an installed torch, so install torch first and
        # build the rest without isolation.
        run: |
          uv pip install --system torch
          uv pip install --system --no-build-isolation -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest
        run: pytest -q
