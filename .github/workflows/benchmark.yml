name: benchmark

# Manual (or PR-labelled) dense-vs-sparse performance run. CI runners are CPU-only, so the
# numbers are indicative — latency reflects the dense O(N^2) neighbor build vs the sparse O(N) path.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: |
          uv pip install --system torch
          uv pip install --system --no-build-isolation -e ".[dev]"
      - name: Message-passing parity
        run: python benchmarks/message_passing.py | tee message_passing.txt
      - name: Backbone latency / memory
        run: python benchmarks/backbones.py | tee backbones.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            message_passing.txt
            backbones.txt
